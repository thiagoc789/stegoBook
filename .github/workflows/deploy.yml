name: Desplegar en Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    # Solo despliega con push a main (los PR solo compilan).
    # Las reglas de Firestore NO se despliegan aquí (se publican a mano en la consola).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Credenciales de Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT en GitHub"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Deploy a Firebase Hosting (sitio stegobook)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm i -g firebase-tools@latest >/dev/null 2>&1
          # Crea el sitio la primera vez (si ya existe, sigue)
          firebase hosting:sites:get stegobook --project stego-cd22b --non-interactive >/dev/null 2>&1 \
            || firebase hosting:sites:create stegobook --project stego-cd22b --non-interactive || true
          firebase deploy --only hosting:stegobook --project stego-cd22b --non-interactive --force
      - name: Limpiar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
